name: Update Google Scholar card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Scholar data
        run: python3 scripts/update_scholar_card.py

      - name: Commit updated card
        run: |
          if git diff --quiet -- content/about.toml; then
            echo "Scholar card is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/about.toml
          git commit -m "Update Google Scholar card"
          git push
