<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="765" viewBox="0 0 1100 765" role="img" aria-labelledby="title desc">
  <title id="title">DNA-based archival storage workflow preview</title>
  <desc id="desc">An original schematic preview showing image archives encoded, written to DNA, passed through a noisy storage channel, and reconstructed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="dna" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2bb3a3"/>
      <stop offset="1" stop-color="#d99a43"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#233247"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <style>
      .label { font: 700 28px Georgia, serif; fill: #1f2937; }
      .sub { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0.4px; }
      .card { fill: #ffffff; stroke: #d8e1ec; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .chip { fill: #eef6f4; stroke: #b6d9d0; stroke-width: 1.5; rx: 10; }
      .accent { fill: #d99a43; }
      .teal { fill: #2bb3a3; }
      .ink { stroke: #233247; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #516174; stroke-width: 2; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1100" height="765" fill="url(#bg)"/>
  <rect x="42" y="42" width="1016" height="681" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="82" y="102" class="label">DNA-Based Archival Storage</text>
  <text x="82" y="136" class="sub">From digital archives to molecular storage and algorithmic reconstruction</text>

  <g transform="translate(86 205)">
    <rect class="card" width="190" height="205"/>
    <text x="28" y="44" class="tiny">ARCHIVE</text>
    <rect x="35" y="70" width="120" height="90" rx="8" fill="#eaf2fb" stroke="#b8c8da" stroke-width="2"/>
    <path d="M55 135 L84 105 L105 128 L122 112 L145 150 L48 150 Z" fill="#88b8d8"/>
    <circle cx="122" cy="94" r="12" fill="#f4c66f"/>
    <text x="34" y="182" class="sub">image / file</text>
  </g>

  <path class="ink" marker-end="url(#arrow)" d="M294 307 H372"/>

  <g transform="translate(388 205)">
    <rect class="card" width="260" height="205"/>
    <text x="30" y="44" class="tiny">ALGORITHMIC ENCODING</text>
    <rect class="chip" x="30" y="70" width="200" height="34"/>
    <text x="47" y="93" class="sub">source coding</text>
    <rect class="chip" x="30" y="118" width="200" height="34"/>
    <text x="47" y="141" class="sub">error tolerance</text>
    <rect class="chip" x="30" y="166" width="200" height="34"/>
    <text x="47" y="189" class="sub">transcoding</text>
  </g>

  <path class="ink" marker-end="url(#arrow)" d="M667 307 H745"/>

  <g transform="translate(760 205)">
    <rect class="card" width="250" height="205"/>
    <text x="30" y="44" class="tiny">DNA MOLECULES</text>
    <path d="M52 72 C116 112 116 152 196 192" class="thin"/>
    <path d="M196 72 C116 112 116 152 52 192" class="thin"/>
    <g stroke="url(#dna)" stroke-width="5" stroke-linecap="round">
      <line x1="75" y1="90" x2="173" y2="90"/>
      <line x1="65" y1="115" x2="183" y2="115"/>
      <line x1="65" y1="142" x2="183" y2="142"/>
      <line x1="75" y1="168" x2="173" y2="168"/>
    </g>
    <text x="33" y="188" class="sub">A C G T strands</text>
  </g>

  <g transform="translate(138 507)">
    <rect x="0" y="0" width="824" height="118" rx="22" fill="#f8fbfd" stroke="#d9e3ee" stroke-width="2"/>
    <text x="38" y="40" class="tiny">NOISY STORAGE CHANNEL</text>
    <text x="38" y="76" class="sub">synthesis errors, sampling loss, sequencing noise, and missing order</text>
    <g transform="translate(575 25)">
      <circle cx="18" cy="28" r="7" class="teal"/>
      <circle cx="58" cy="18" r="7" class="accent"/>
      <circle cx="96" cy="36" r="7" class="teal"/>
      <circle cx="136" cy="24" r="7" class="accent"/>
      <path d="M18 28 C45 8 72 48 96 36 S124 16 136 24" class="ink" stroke-width="3"/>
    </g>
  </g>

  <path class="ink" marker-end="url(#arrow)" d="M885 410 V490"/>
  <path class="ink" marker-end="url(#arrow)" d="M585 625 V682 H230 V430"/>

  <g transform="translate(367 648)">
    <rect x="0" y="-55" width="365" height="88" rx="18" fill="#fff7ed" stroke="#efd4ad" stroke-width="2"/>
    <text x="30" y="-19" class="tiny">RETRIEVAL + DECODING</text>
    <text x="30" y="10" class="sub">clustering, reconstruction, ECC, recovery</text>
  </g>
</svg>
